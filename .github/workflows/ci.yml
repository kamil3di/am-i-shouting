name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      # Catches breakage in the packaging scripts, which the test suite cannot
      # see but every release depends on.
      - name: Assemble the app bundle
        run: ./Scripts/build-app.sh
