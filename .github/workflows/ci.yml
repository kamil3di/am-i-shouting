name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      # Runs the whole release path apart from signing and publishing, so a
      # broken script or a universal-build problem fails here rather than on a
      # tag.
      - name: Build the universal app and package the DMG
        run: make dmg
